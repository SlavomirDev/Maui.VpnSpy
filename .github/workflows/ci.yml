name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            workloads: maui-android
          - os: macos-latest
            workloads: maui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install ${{ matrix.workloads }}

      - name: Restore
        run: dotnet restore Maui.VpnSpy.sln

      - name: Build Android (all OS)
        run: dotnet build src/Maui.VpnSpy/Maui.VpnSpy.csproj -c Release -f net10.0-android --no-restore

      - name: Build iOS
        if: runner.os == 'macOS'
        run: dotnet build src/Maui.VpnSpy/Maui.VpnSpy.csproj -c Release -f net10.0-ios --no-restore

      - name: Build Mac Catalyst
        if: runner.os == 'macOS'
        run: dotnet build src/Maui.VpnSpy/Maui.VpnSpy.csproj -c Release -f net10.0-maccatalyst --no-restore
